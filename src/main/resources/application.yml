proxy:
  host: 0.0.0.0
  port: 6379
  cluster-nodes:
    - "127.0.0.1:7000"
    - "127.0.0.1:7001"
  connect-timeout-ms: 2000

management:
  server:
    port: 6380
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    io.github.nslootsky.valkeyway: INFO
    root: INFO
