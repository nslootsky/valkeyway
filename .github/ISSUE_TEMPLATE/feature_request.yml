name: Feature request
description: Something the proxy should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you're trying to do, and what gets in the way today. A command that's missing, a client that doesn't work, a setting you need ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How you'd want it to work, if you have something in mind.
