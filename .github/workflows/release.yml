name: Release

# Pushing a version tag (v0.2.0) builds and tests the proxy, publishes a GitHub release with the
# jar and the CHANGELOG.md section for that version, and pushes the image to the GitHub Container
# Registry as ghcr.io/<owner>/valkeyway:<version> and :latest, for linux/amd64 and linux/arm64.
# The jar and the image get signed build provenance (gh attestation verify), and the image an SBOM.
on:
  push:
    tags: ['v*']

permissions:
  contents: write       # create the release
  packages: write       # push the image
  id-token: write       # sign the provenance (Sigstore)
  attestations: write   # store it

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Check the tag matches the project version
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the project version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Pull the test images
        # Once, before the tests: Testcontainers pulls an image when a test first needs it, once per
        # node starting at the same moment. Keep in step with ValkeyClusterTestContainer.IMAGE and
        # SeedDnsTest.
        run: |
          docker pull -q valkey/valkey-bundle:9.1.4-alpine & valkey=$!
          docker pull -q eclipse-temurin:25-jre-alpine & jre=$!
          wait $valkey && wait $jre

      - name: Build and test
        run: |
          ./mvnw compile test -Dskip.integration.tests=true
          ./mvnw package -DskipTests
          ./mvnw failsafe:integration-test failsafe:verify -Dskip.integration.tests=false

      - name: Release notes from CHANGELOG.md
        run: |
          # The section between "## [<version>]" and the next "## [" heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for $VERSION in CHANGELOG.md" >&2
            exit 1
          fi
          # Relative links (docs/...) don't resolve on the release page.
          sed -i -E "s#\]\((docs/[^)]*)\)#](${{ github.server_url }}/${{ github.repository }}/blob/$GITHUB_REF_NAME/\1)#g" release-notes.md

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/valkeyway:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/valkeyway:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT

      # Provenance: which workflow, commit and tag built them, signed and stored with GitHub (for the
      # image also in the registry). Storage records need an organization-owned repository.
      - name: Attest the jar
        uses: actions/attest@v4
        with:
          subject-path: target/valkeyway-${{ env.VERSION }}.jar

      - name: Attest the image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/valkeyway
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/valkeyway-"$VERSION".jar \
            --title "ValkeyWay $GITHUB_REF_NAME" --notes-file release-notes.md
