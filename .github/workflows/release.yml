name: Release

# Pushing a version tag (v0.2.0) builds and tests the proxy, publishes a GitHub release with the
# jar and the CHANGELOG.md section for that version, and pushes the image to the GitHub Container
# Registry as ghcr.io/<owner>/valkeyway:<version> and :latest, for linux/amd64 and linux/arm64.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create the release
  packages: write   # push the image

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Check the tag matches the project version
        run: |
          version=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match the project version $version" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and test
        run: |
          ./mvnw compile test -Dskip.integration.tests=true
          ./mvnw package -DskipTests
          ./mvnw failsafe:integration-test failsafe:verify -Dskip.integration.tests=false

      - name: Release notes from CHANGELOG.md
        run: |
          # The section between "## [<version>]" and the next "## [" heading.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No section for $VERSION in CHANGELOG.md" >&2
            exit 1
          fi
          # Relative links (docs/...) don't resolve on the release page.
          sed -i -E "s#\]\((docs/[^)]*)\)#](${{ github.server_url }}/${{ github.repository }}/blob/$GITHUB_REF_NAME/\1)#g" release-notes.md

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/valkeyway:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/valkeyway:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=MIT

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" target/valkeyway-"$VERSION".jar \
            --title "ValkeyWay $GITHUB_REF_NAME" --notes-file release-notes.md
