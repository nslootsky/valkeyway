name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: |
            target
            .m2
          key: build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-

      - name: Compile and run unit tests
        run: ./mvnw compile test -Dskip.integration.tests=true

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Restore build artifacts
        uses: actions/cache@v6
        with:
          path: |
            target
            .m2
          key: build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-

      - name: Run integration tests
        run: ./mvnw failsafe:integration-test failsafe:verify -Dskip.integration.tests=false
