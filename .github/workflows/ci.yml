name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Cache build artifacts
        uses: actions/cache@v6
        with:
          path: |
            target
            .m2
          key: build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-

      - name: Compile and run unit tests
        run: ./mvnw compile test -Dskip.integration.tests=true

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Restore build artifacts
        uses: actions/cache@v6
        with:
          path: |
            target
            .m2
          key: build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}-

      - name: Package
        # SeedDnsTest runs the packaged proxy jar in a container.
        run: ./mvnw package -DskipTests

      - name: Pull the test images
        # Once, before the tests: Testcontainers pulls an image when a test first needs it, once per
        # node starting at the same moment. Keep in step with ValkeyClusterTestContainer.IMAGE and
        # SeedDnsTest.
        run: |
          docker pull -q valkey/valkey-bundle:9.1.4-alpine & valkey=$!
          docker pull -q eclipse-temurin:25-jre-alpine & jre=$!
          wait $valkey && wait $jre

      - name: Run integration tests
        run: ./mvnw failsafe:integration-test failsafe:verify -Dskip.integration.tests=false
