name: DCO

# Every commit in a pull request must carry a Signed-off-by line for its author's email
# (see CONTRIBUTING.md). Dependabot's pull requests are exempt.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Check that every commit is signed off by its author
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git log -1 --format=%ae "$commit")
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$commit" | grep -qiF "<$email>"; then
              echo "::error::Commit $(git log -1 --format='%h (%s)' "$commit") has no Signed-off-by line for $email"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off the branch's commits and push again:" >&2
            echo "  git rebase --signoff $BASE && git push --force-with-lease" >&2
            exit 1
          fi
          echo "Every commit is signed off."
